<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Approval Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Loan Approval Prediction</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('predict') }}" class="row g-3">
        <!-- Gender -->
        <div class="col-md-6">
            <label class="form-label" for="Gender">Gender</label>
            <select class="form-select" name="Gender" id="Gender" required>
                <option value="">Select...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <!-- Married -->
        <div class="col-md-6">
            <label class="form-label" for="Married">Married</label>
            <select class="form-select" name="Married" id="Married" required>
                <option value="">Select...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>
        <!-- Dependents -->
        <div class="col-md-6">
            <label class="form-label" for="Dependents">Dependents</label>
            <select class="form-select" name="Dependents" id="Dependents" required>
                <option value="">Select...</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3+">3+</option>
            </select>
        </div>
        <!-- Education -->
        <div class="col-md-6">
            <label class="form-label" for="Education">Education</label>
            <select class="form-select" name="Education" id="Education" required>
                <option value="">Select...</option>
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
            </select>
        </div>
        <!-- Self Employed -->
        <div class="col-md-6">
            <label class="form-label" for="Self_Employed">Self Employed</label>
            <select class="form-select" name="Self_Employed" id="Self_Employed" required>
                <option value="">Select...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>
        <!-- Applicant Income -->
        <div class="col-md-6">
            <label class="form-label" for="ApplicantIncome">Applicant Income</label>
            <input type="number" step="any" class="form-control" name="ApplicantIncome" id="ApplicantIncome" required>
        </div>
        <!-- Coapplicant Income -->
        <div class="col-md-6">
            <label class="form-label" for="CoapplicantIncome">Co‑applicant Income</label>
            <input type="number" step="any" class="form-control" name="CoapplicantIncome" id="CoapplicantIncome" required>
        </div>
        <!-- Loan Amount -->
        <div class="col-md-6">
            <label class="form-label" for="LoanAmount">Loan Amount (in thousands)</label>
            <input type="number" step="any" class="form-control" name="LoanAmount" id="LoanAmount" required>
        </div>
        <!-- Loan Amount Term -->
        <div class="col-md-6">
            <label class="form-label" for="Loan_Amount_Term">Loan Amount Term (days)</label>
            <input type="number" step="any" class="form-control" name="Loan_Amount_Term" id="Loan_Amount_Term" required>
        </div>
        <!-- Credit History -->
        <div class="col-md-6">
            <label class="form-label" for="Credit_History">Credit History (1 = good, 0 = bad)</label>
            <select class="form-select" name="Credit_History" id="Credit_History" required>
                <option value="">Select...</option>
                <option value="1">1</option>
                <option value="0">0</option>
            </select>
        </div>
        <!-- Property Area -->
        <div class="col-md-6">
            <label class="form-label" for="Property_Area">Property Area</label>
            <select class="form-select" name="Property_Area" id="Property_Area" required>
                <option value="">Select...</option>
                <option value="Urban">Urban</option>
                <option value="Semiurban">Semiurban</option>
                <option value="Rural">Rural</option>
            </select>
        </div>
        <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary btn-lg">Predict Loan Status</button>
            <button type="reset" class="btn btn-secondary btn-lg ms-2">Clear</button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
